function Wordmark({ size = 20, color, accent }) {
  const c = color || BRAND.ink;
  const a = accent || BRAND.signal;
  return (
    <span style={{
      fontFamily: FONTS.mono,
      fontSize: size,
      fontWeight: 500,
      letterSpacing: '-0.04em',
      color: c,
      display: 'inline-flex',
      alignItems: 'baseline',
      gap: size * 0.08,
      lineHeight: 1,
    }}>
      <span>zvirych</span>
      <span style={{
        display: 'inline-block',
        width: size * 0.55,
        height: size * 0.55,
        background: a,
        transform: `translateY(${size * 0.02}px)`,
        flexShrink: 0,
      }} />
      <span>leksandr</span>
    </span>
  );
}

function Mark({ size = 48, bg, fg, accent }) {
  return (
    <div style={{
      width: size,
      height: size,
      background: bg || BRAND.ink,
      color: fg || BRAND.paper,
      position: 'relative',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      fontFamily: FONTS.mono,
      fontSize: size * 0.5,
      fontWeight: 500,
      letterSpacing: '-0.05em',

        bottom: size * 0.15,
        width: size * 0.14,
        height: size * 0.14,
        background: accent || BRAND.signal,
      }} />

  );
}

function Button({ children, variant = 'primary', onClick, arrow = false, href, size = 'md' }) {
  const [hover, setHover] = React.useState(false);
  const sizes = {
    sm: { padY: 10, padX: 16, fs: 12 },
    md: { padY: 16, padX: 24, fs: 13 },
    lg: { padY: 20, padX: 32, fs: 14 },
  };
  const s = sizes[size];
  const variants = {
    primary: {
      bg: hover ? BRAND.signal : BRAND.ink,
      fg: hover ? BRAND.ink : BRAND.paper,
      border: `1px solid ${BRAND.ink}`,
    },
    secondary: {
      bg: 'transparent',
      fg: BRAND.ink,
      border: `1px solid ${BRAND.ink}`,
    },
    ghost: {
      bg: hover ? BRAND.ink : 'transparent',
      fg: hover ? BRAND.paper : BRAND.ink,
      border: `1px solid ${BRAND.ink}`,
    },
    signal: {
      bg: BRAND.signal,
      fg: BRAND.ink,
      border: `1px solid ${BRAND.ink}`,
      transform: hover ? 'translate(-3px, -3px)' : 'translate(0,0)',
      shadow: hover ? `3px 3px 0 ${BRAND.ink}` : '0 0 0 transparent',
    },
  };
  const v = variants[variant];
  const C = href ? 'a' : 'button';
  return (
    <C
      href={href}
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        fontFamily: FONTS.mono,
        fontSize: s.fs,
        fontWeight: 500,
        letterSpacing: '0.06em',
        textTransform: 'uppercase',
        padding: `${s.padY}px ${s.padX}px`,
        background: v.bg,
        color: v.fg,
        border: v.border,
        borderRadius: 0,
        cursor: 'pointer',
        display: 'inline-flex',
        alignItems: 'center',
        gap: 12,
        transition: 'background 120ms ease, color 120ms ease, transform 120ms ease, box-shadow 120ms ease',
        transform: v.transform || 'none',
        boxShadow: v.shadow || 'none',
        textDecoration: 'none',
        whiteSpace: 'nowrap',
        outline: 'none',
      }}
    >
      {children}
      {arrow && <span style={{ fontSize: s.fs + 2 }}>→</span>}
    </C>
  );
}

function SectionTitle({ eyebrow, children, onDark = false }) {

function Ticker({ items, speed = 40, dark = false }) {
  const content = (
    <div style={{
      display: 'inline-flex',
      gap: 48,
      paddingRight: 48,
      alignItems: 'center',
    }}>

          fontWeight: 500,
          letterSpacing: '0.04em',
          color: dark ? BRAND.paper : BRAND.ink,

          gap: 12,
          whiteSpace: 'nowrap',
        }}>
          <span style={{ width: 6, height: 6, background: BRAND.signal, flexShrink: 0 }} />
          {it}
        </span>
      ))}
    </div>
  );
  return (
    <div style={{
      overflow: 'hidden',
      width: '100%',
      borderTop: `1px solid ${dark ? BRAND.graphite : BRAND.ink}`,
      borderBottom: `1px solid ${dark ? BRAND.graphite : BRAND.ink}`,
      background: dark ? BRAND.ink : BRAND.paper,
      padding: '14px 0',
    }}>
      <div style={{
        display: 'flex',
        width: 'max-content',
        animation: `ticker ${speed}s linear infinite`,
      }}>
        {content}{content}{content}
      </div>
    </div>
  );
}

function Field({ label, placeholder, multiline }) {
  const [val, setVal] = React.useState('');
  const [focus, setFocus] = React.useState(false);
  const C = multiline ? 'textarea' : 'input';
  return (
    <label style={{ display: 'block' }}>
      <div style={{ fontFamily: FONTS.mono, fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: BRAND.graphite, marginBottom: 8 }}>
        {label}
      </div>
      <C
        value={val}
        onChange={(e) => setVal(e.target.value)}
        onFocus={() => setFocus(true)}
        onBlur={() => setFocus(false)}
        placeholder={placeholder}
        rows={multiline ? 4 : undefined}
        style={{
          width: '100%',
          border: 'none',
          borderBottom: `1px solid ${focus ? BRAND.ink : BRAND.ash}`,
          outline: 'none',
          background: 'transparent',
          padding: '8px 0',
          fontFamily: FONTS.display,
          fontSize: 18,
          color: BRAND.ink,
          resize: multiline ? 'vertical' : 'none',
          fontWeight: 400,
          transition: 'border-color 120ms',
        }}
      />
    </label>
  );
}

function RadioField({ label, options }) {
  const [sel, setSel] = React.useState(null);
  return (
    <div>
      <div style={{ fontFamily: FONTS.mono, fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: BRAND.graphite, marginBottom: 12 }}>
        {label}
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
        {options.map(o => (
          <button
            key={o}
            onClick={() => setSel(o)}
            style={{
              fontFamily: FONTS.mono, fontSize: 12,
              padding: '10px 16px',
              border: `1px solid ${BRAND.ink}`,
              background: sel === o ? BRAND.ink : 'transparent',
              color: sel === o ? BRAND.paper : BRAND.ink,
              borderRadius: 0,
              cursor: 'pointer',
              letterSpacing: '0.04em',
              outline: 'none',
              transition: 'background 120ms, color 120ms',
            }}
          >
            {o}
          </button>
        ))}
      </div>
    </div>
  );
}
